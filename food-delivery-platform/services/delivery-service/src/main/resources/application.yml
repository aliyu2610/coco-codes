spring:
  application:
    name: delivery-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/delivery_db}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none          # schema managed by infra/mysql/init scripts
    open-in-view: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
