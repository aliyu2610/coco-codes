name: CI

on:
  push:
    branches: ["main", "develop"]

  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── order-service (Java / Spring Boot) ────────────────────────────────────

  order-service:
    name: order-service — build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & test
        run: mvn verify -B -e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-surefire
          path: |
            services/order-service/target/surefire-reports/**
            services/order-service/target/*.dump
            services/order-service/target/*.dumpstream
          if-no-files-found: warn


  # ── restaurant-service (Java / Spring Boot) ───────────────────────────────

  restaurant-service:
    name: restaurant-service — build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/restaurant-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build (no tests yet)
        run: mvn package -DskipTests -B


  # ── delivery-service (Java / Spring Boot) ─────────────────────────────────

  delivery-service:
    name: delivery-service — build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/delivery-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build (no tests yet)
        run: mvn package -DskipTests -B


  # ── eta-service (Python / FastAPI) ─────────────────────────────────────────

  eta-service:
    name: eta-service — lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/eta-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eta-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short


  # ── Docker Compose smoke test (main branch only) ──────────────────────────

  smoke-test:
    name: infra smoke test
    runs-on: ubuntu-latest

    needs: [order-service, eta-service]

    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Start infra containers
        run: docker compose up -d mysql

      - name: Wait for MySQL healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' infra-mysql-1 2>/dev/null || echo "starting")

            echo "MySQL status: $STATUS (attempt $i)"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            sleep 5
          done

          if [ "$STATUS" != "healthy" ]; then
            docker compose logs mysql
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v\
      